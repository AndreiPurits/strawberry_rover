# Lab-only Robolap config for peduncle_v3.1_plastic.
# Production config/peduncle_v3_runtime.yaml is UNCHANGED.
#
# Usage:
#   PEDUNCLE_V3_CONFIG=config/peduncle_v3_1_plastic_lab.yaml \
#     python3 scripts/roarm_one_shot_approach.py --peduncle ...
#
# Or:
#   python3 scripts/run_peduncle_v3_perception.py --config config/peduncle_v3_1_plastic_lab.yaml ...

enabled: true
runtime_preference: engine   # engine > onnx > pt
device: "0"
precision: fp16

model_roots:
  - runs/deploy_orin_new
  - runs/peduncle_v3_1_plastic/export
  - models/hf_peduncle_v3

models:
  # Calyx + association stay on frozen v3
  calyx:
    engine: models/calyx.engine
    onnx: models/calyx.onnx
    pt: models/calyx.pt
    imgsz: 640
  peduncle:
    engine: models/peduncle_v31_plastic.engine
    onnx: models/peduncle_v31_plastic.onnx
    pt: models/peduncle_v31_plastic.pt
    imgsz: 640
  association:
    json: models/association_logreg_v3.json
    threshold: 0.1

association:
  threshold: 0.1
  ambiguity_margin: 0.05

depth_min_m: 0.08
depth_max_m: 0.17
require_approach_ok: true

framing:
  target_nx: 0.50
  target_ny: 0.58
  tol_nx: 0.08
  tol_ny: 0.08
  edge_margin_px: 12
  headroom_berry_scale: 0.85
  headroom_min_px: 40
  side_pad_berry_scale: 0.25
  max_center_iters: 6
  max_step_rad: 0.10
  center_gain: 0.90
  max_move_px: 160
  settle_s: 0.28
  lookup_iters: 3
  depth_aim_m: 0.14
  depth_slack_m: 0.030

infer:
  calyx_conf: 0.15
  peduncle_conf: 0.15
  peduncle_iou: 0.45
  peduncle_max_det: 15

focus_roi:
  width_scale: 1.6
  height_above_scale: 0.85
  height_below_scale: 0.45
  min_size_px: 160
  max_size_px: 640
  pad_px: 8

standoff:
  enabled_default: false
  offset_berry_scale: 0.22
  standoff_depth_m: 0.12

grasp_point:
  offset_berry_scale: 0.32
  min_offset_berry_scale: 0.28
  min_offset_px: 8.0
  tip_margin_scale: 0.18
  tip_margin_px: 6.0
  min_calyx_clearance_berry_scale: 0.18
  min_stem_length_px: 12.0

temporal_verification:
  required_frames: 3
  max_acquire_frames: 7
  frame_gap_s: 0.12
  max_base_shift_px: 18
  max_grasp_shift_px: 22
  max_calyx_shift_px: 20
  max_angle_change_deg: 25
  max_obb_switch_px: 28

grasp:
  pre_acquire_settle_s: 0.35
  post_standoff_settle_s: 0.40
  pre_close_settle_s: 0.25
  standoff_spd: 0.10
  standoff_acc: 6.0
  approach_spd: 0.08
  approach_acc: 5.0
  final_approach_depth_m: 0.09
  max_grasp_depth_m: 0.22
  close_cmd: 2.2
  close_spd: 0
  close_acc: 8
  torque_g: 300
  settle_s: 0.8
  verify_g_min: 1.45
  verify_g_tol: 0.55

logging:
  dir: runs/peduncle_v3_1_plastic_lab_runtime

lab_profile: peduncle_v3.1_plastic
production_safe: true  # never writes over peduncle.engine
